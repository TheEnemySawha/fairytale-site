name: Генерація щоденної казки
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '0 15 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  generate-story:
    runs-on: ubuntu-latest
    steps:
      - name: Генеруємо нову казку
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 << 'EOF'
          import os, re, json, urllib.request
          from datetime import datetime, timezone

          DEEPSEEK_KEY = os.environ['DEEPSEEK_API_KEY']
          SUPABASE_URL = os.environ['SUPABASE_URL']
          SUPABASE_KEY = os.environ['SUPABASE_SERVICE_ROLE_KEY']

          def deepseek(system, user):
              url = 'https://api.deepseek.com/chat/completions'
              data = json.dumps({
                  'model': 'deepseek-v4-flash',
                  'messages': [
                      {'role': 'system', 'content': system},
                      {'role': 'user', 'content': user}
                  ],
                  'max_tokens': 2000,
                  'temperature': 0.7
              }).encode()
              req = urllib.request.Request(url, data=data)
              req.add_header('Content-Type', 'application/json')
              req.add_header('Authorization', f'Bearer {DEEPSEEK_KEY}')
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())['choices'][0]['message']['content']

          def parse(text, title_key, moral_key):
              title = re.search(rf'{title_key}:\\s*(.+)', text)
              moral = re.search(rf'{moral_key}:\\s*(.+)', text)
              emoji = re.search(r'Emoji:\\s*(.+)', text)
              content = re.sub(rf'{title_key}:.+', '', text)
              content = re.sub(rf'{moral_key}:.+', '', content)
              content = re.sub(r'Emoji:.+', '', content).strip()
              return {
                  'title': title.group(1).strip() if title else '',
                  'content': content,
                  'moral': moral.group(1).strip() if moral else '',
                  'emoji': emoji.group(1).strip() if emoji else '📖'
              }

          print('UA Генеруємо...')
          ua_text = deepseek(
              'Ти талановитий дитячий письменник. Відповідай лише українською мовою.',
              'Напиши теплу добру дитячу казку українською для дітей від 6 років. Довжина 600-900 слів.\n\nФормат:\nЗаголовок: [назва]\n\n[текст]\n\nМораль: [мораль]\n\nEmoji: [один емодзі]'
          )
          ua = parse(ua_text, 'Заголовок', 'Мораль')
          print(f'   {ua["title"]} | {len(ua["content"])} chars')

          print('EN Перекладаємо...')
          en_text = deepseek(
              'You are a professional translator of children books. Respond only in English. Write actual translated text, never use placeholder text.',
              'Translate the following Ukrainian fairy tale into English.\nRespond ONLY with the translation using this exact format:\n\nTitle: <actual english title>\n\n<full story in english>\n\nMoral: <actual moral in english>\n\nUkrainian story:\n' + ua_text
          )
          en = parse(en_text, 'Title', 'Moral')
          print(f'   {en["title"]} | {len(en["content"])} chars')

          print('ES Перекладаємо...')
          es_text = deepseek(
              'Eres traductor profesional de libros infantiles. Responde solo en espanol. Escribe texto traducido real, nunca uses texto de marcador.',
              'Traduce el siguiente cuento ucraniano al espanol.\nResponde SOLO con la traduccion usando este formato exacto:\n\nTitulo: <titulo real en espanol>\n\n<historia completa en espanol>\n\nMoraleja: <moraleja real en espanol>\n\nCuento ucraniano:\n' + ua_text
          )
          es = parse(es_text, 'Titulo', 'Moraleja')
          print(f'   {es["title"]} | {len(es["content"])} chars')

          story = {
              'title': ua['title'], 'content': ua['content'], 'moral': ua['moral'],
              'cover_emoji': ua['emoji'],
              'title_en': en['title'], 'content_en': en['content'], 'moral_en': en['moral'],
              'title_es': es['title'], 'content_es': es['content'], 'moral_es': es['moral'],
              'published_at': datetime.now(timezone.utc).isoformat()
          }

          print('Зберігаємо в базу...')
          url = SUPABASE_URL + '/rest/v1/stories'
          data = json.dumps(story).encode()
          req = urllib.request.Request(url, data=data, method='POST')
          req.add_header('Content-Type', 'application/json')
          req.add_header('apikey', SUPABASE_KEY)
          req.add_header('Authorization', f'Bearer {SUPABASE_KEY}')
          req.add_header('Prefer', 'return=minimal')

          with urllib.request.urlopen(req) as r:
              print(f'Готово! Статус: {r.status}')
          EOF
